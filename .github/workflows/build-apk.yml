name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # permite rodar manualmente com um clique

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar dependências
        run: pnpm install

      - name: Build do app (Vite)
        run: pnpm run build

      - name: Adicionar plataforma Android (Capacitor)
        run: npx cap add android || true

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v5

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MasterTopA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
